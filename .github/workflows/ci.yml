name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Same pin as sync.yml and as onenote-mcp, so a validator change can't break a green build unannounced.
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code@2.1.318

      - name: Check the sync script parses
        run: bash -n scripts/sync.sh

      - name: Validate marketplace
        run: claude plugin validate --strict .
